spec_version: 1
name: pll-cyberattack-detection
type: space
runtime: fastapi
app: server.app:app
port: 7860

# ---- Environment card ---------------------------------------------------
version: 2.0.0
description: >
  Cyber-guard for a grid-connected inverter. An agent watches the signals of a
  5 kHz-simulated SRF phase-locked loop and a delayed, trusted PMU stream, and must
  detect, classify and mitigate false-data-injection attacks on the voltage sensors
  without alarming on natural grid disturbances (phase jumps, sags, single-phase
  faults, harmonic steps, frequency events).
tags: [openenv, power-systems, cybersecurity, smart-grid, control-systems, pll, fdi, intrusion-detection]
episode:
  steps: 40
  decision_interval_ms: 50
  simulation_rate_hz: 5000
reward_range: [-3.21, 0.69]
action:
  model: pll_cyber.models.PLLAction
  fields:
    attack_detected: {type: bool}
    attack_type: {type: int, range: [0, 4], meaning: "0 none, 1 sinusoidal, 2 ramp, 3 pulse, 4 phase spoofing"}
    confidence: {type: float, range: [0.0, 1.0], scored_with: brier}
    protective_action: {type: int, range: [0, 3], meaning: "0 none, 1 alert, 2 PMU-aided holdover, 3 disconnect (latched)"}
observation:
  model: pll_cyber.models.PLLObservation
  groups: [waveforms, features, pmu, trend, reward_breakdown, episode_result]
tasks:
  - id: 0
    name: sinusoidal_fdi_detection
    difficulty: easy
    grader: pll_cyber.graders.grade_easy
    score_range: [0.0, 1.0]
  - id: 1
    name: attack_classification_under_disturbances
    difficulty: medium
    grader: pll_cyber.graders.grade_medium
    score_range: [0.0, 1.0]
  - id: 2
    name: stealthy_phase_spoofing_mitigation
    difficulty: hard
    grader: pll_cyber.graders.grade_hard
    score_range: [0.0, 1.0]
