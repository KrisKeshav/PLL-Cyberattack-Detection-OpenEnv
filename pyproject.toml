[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pll-cyberattack-detection"
version = "2.0.0"
description = "OpenEnv environment: detect, classify and mitigate false-data-injection attacks on the SRF-PLL of a grid-connected inverter"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Kris Keshav" }]
keywords = ["openenv", "reinforcement-learning", "power-systems", "cybersecurity", "pll", "smart-grid"]
dependencies = [
    "openenv-core>=0.3.0,<0.4",
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "openai>=1.40",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
server = "server.app:main"

[project.urls]
Repository = "https://github.com/KrisKeshav/PLL-Cyberattack-Detection-OpenEnv"
Space = "https://huggingface.co/spaces/krishuggingface/CyberAttack-PLL"

[tool.setuptools]
packages = ["pll_cyber", "server"]
py-modules = ["inference"]

[tool.setuptools.package-data]
server = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
